<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Peeky screenshots</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1440px; height: 900px; overflow: hidden; }
  body { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; color: #111114; background: #f6f6f8; position: relative; }
  body::before { content: ""; position: absolute; inset: 0; background: radial-gradient(900px 620px at 50% 108%, #e7e9f1 0%, rgba(231, 233, 241, 0) 70%), linear-gradient(#fbfbfd, #f1f2f5); }

  .copy { position: absolute; left: 0; right: 0; text-align: center; z-index: 3; }
  .kicker { font-size: 15px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: #8b8d98; margin-bottom: 14px; }
  h1 { font-size: 58px; line-height: 1.06; font-weight: 650; letter-spacing: -.025em; }
  p { margin-top: 16px; font-size: 22px; color: #6c6e79; letter-spacing: -.005em; }

  /* the real app runs in here, transparent, exactly as it does on the desktop */
  #app { position: absolute; border: 0; width: 700px; height: 640px; background: transparent; z-index: 2; transform-origin: 50% 0; }

  /* ---- laptop ---- */
  body.laptop .copy { top: 62px; }
  .mac { position: absolute; left: 50%; top: 286px; width: 1060px; margin-left: -530px; display: none; }
  body.laptop .mac { display: block; }
  .lid { height: 640px; border-radius: 22px 22px 0 0; background: #0b0b0d; padding: 13px 13px 0; box-shadow: 0 0 0 1.5px #c9cbd3, 0 40px 90px -30px rgba(30, 34, 60, .35); }
  .screen { height: 100%; border-radius: 10px 10px 0 0; overflow: hidden; position: relative;
    background:
      radial-gradient(520px 380px at 18% 30%, #ffd9c7 0%, rgba(255, 217, 199, 0) 70%),
      radial-gradient(560px 420px at 84% 22%, #cfdcff 0%, rgba(207, 220, 255, 0) 70%),
      radial-gradient(640px 460px at 55% 96%, #d9f1e6 0%, rgba(217, 241, 230, 0) 70%),
      linear-gradient(#f4f2f8, #eceef6); }
  body.laptop #app { left: 50%; margin-left: -350px; top: 303px; }

  /* ---- zoomed: the pill alone, large ---- */
  body.zoom .copy { bottom: 108px; }
  body.zoom h1 { font-size: 52px; }
  .stage { position: absolute; left: 50%; top: 96px; width: 1120px; height: 470px; margin-left: -560px; border-radius: 44px; display: none; overflow: hidden;
    background:
      radial-gradient(560px 380px at 14% 18%, #ffdccb 0%, rgba(255, 220, 203, 0) 70%),
      radial-gradient(600px 420px at 88% 24%, #d2deff 0%, rgba(210, 222, 255, 0) 70%),
      radial-gradient(700px 420px at 52% 110%, #d8f2e5 0%, rgba(216, 242, 229, 0) 70%),
      linear-gradient(#f5f3f9, #ecedf5);
    box-shadow: inset 0 0 0 1px rgba(20, 22, 40, .06), 0 50px 90px -50px rgba(30, 34, 60, .3); }
  body.zoom .stage { display: block; }
  body.zoom #app { left: 50%; margin-left: -350px; }
</style>
</head>
<body class="laptop">
  <div class="copy"><div class="kicker" id="k"></div><h1 id="h"></h1><p id="s"></p></div>
  <div class="mac"><div class="lid"><div class="screen"></div></div></div>
  <div class="stage"></div>
  <iframe id="app" src="../ui/index.html" allowtransparency="true"></iframe>
<script>
  // mode: 'laptop' (the pill at its real place on a screen) or 'zoom' (the pill alone, scale times larger, top px from the page top)
  window.setScene = (o) => {
    document.body.className = o.mode;
    document.getElementById('k').textContent = o.kicker || '';
    document.getElementById('h').textContent = o.title || '';
    document.getElementById('s').textContent = o.sub || '';
    const a = document.getElementById('app');
    a.style.transform = o.mode === 'zoom' ? `scale(${o.scale || 2.2})` : (o.scale ? `scale(${o.scale})` : '');
    a.style.top = o.mode === 'zoom' ? (o.top || 118) + 'px' : '';
  };
</script>
</body>
</html>
