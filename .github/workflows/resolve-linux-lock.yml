name: resolve-linux-cargo-lock

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve the complete Linux dependency graph
        working-directory: src-tauri
        run: |
          cargo generate-lockfile
          cargo metadata --format-version 1 --locked > /dev/null

      - name: Commit the cross-platform Cargo lockfile
        run: |
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo "Cargo.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "build: lock Linux and Windows target dependencies"
          git push origin HEAD:main

      - name: Upload resolved Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: Peeky-Linux-Cargo-Lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 1
